name: NotchTerm
options:
  bundleIdPrefix: com.sergiobehrends
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16"
  groupSortPosition: top

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.0.0
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: 3.48.3
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

targets:
  NotchTerm:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: NotchTerm
    resources:
      - path: NotchTerm/Resources/notchterm-hook.py
    dependencies:
      - package: SwiftTerm
      - package: PostHog
        product: PostHog
      - package: Sparkle
        product: Sparkle
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    info:
      path: NotchTerm/Info.plist
      properties:
        LSUIElement: true
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        # Injected from Config/Secrets.xcconfig (gitignored) at build time; read at
        # runtime by PostHogEnv. Empty when no secrets file → analytics disabled.
        POSTHOGProjectToken: $(POSTHOG_PROJECT_TOKEN)
        # Reference build settings so MARKETING_VERSION / CURRENT_PROJECT_VERSION
        # (set in project.yml and overridable via xcodebuild) flow into the bundle.
        # Sparkle reads these from the app's Info.plist to build the appcast.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Sparkle auto-update configuration.
        # SUFeedURL: raw URL of the appcast committed to your GitHub repo.
        #   ▸ EDIT the OWNER/REPO below once the repo exists.
        # SUPublicEDKey: filled in by `generate_keys` (see distribute.sh / README).
        SUFeedURL: https://raw.githubusercontent.com/sbehrends/NotchTerm/main/appcast.xml
        SUPublicEDKey: f9tOAGKFiWdx65zlJKycPbAhnWDdIgRLgjsZHLnKOBQ=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAllowsAutomaticUpdates: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sergiobehrends.NotchTerm
        SWIFT_VERSION: "6.0"
        ENABLE_APP_SANDBOX: "NO"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        CODE_SIGN_ENTITLEMENTS: NotchTerm/NotchTerm.entitlements
        MARKETING_VERSION: "0.3"
        CURRENT_PROJECT_VERSION: "3"
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          # Ad-hoc signing — no Apple Developer Program / Developer ID required.
          # Sparkle validates update integrity via its own EdDSA signature.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "-"
