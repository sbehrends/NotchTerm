name: NotchTerminal
options:
  bundleIdPrefix: com.sergiobehrends
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16"
  groupSortPosition: top

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.0.0
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: 3.48.3
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

targets:
  NotchTerminal:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: NotchTerminal
    resources:
      - path: NotchTerminal/Resources/notch-terminal-hook.py
    dependencies:
      - package: SwiftTerm
      - package: PostHog
        product: PostHog
      - package: Sparkle
        product: Sparkle
    info:
      path: NotchTerminal/Info.plist
      properties:
        LSUIElement: true
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        # Sparkle auto-update configuration.
        # SUFeedURL: raw URL of the appcast committed to your GitHub repo.
        #   ▸ EDIT the OWNER/REPO below once the repo exists.
        # SUPublicEDKey: filled in by `generate_keys` (see distribute.sh / README).
        SUFeedURL: https://raw.githubusercontent.com/OWNER/NotchTerminal/main/appcast.xml
        SUPublicEDKey: f9tOAGKFiWdx65zlJKycPbAhnWDdIgRLgjsZHLnKOBQ=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAllowsAutomaticUpdates: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sergiobehrends.NotchTerminal
        SWIFT_VERSION: "6.0"
        ENABLE_APP_SANDBOX: "NO"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        CODE_SIGN_ENTITLEMENTS: NotchTerminal/NotchTerminal.entitlements
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          # Ad-hoc signing — no Apple Developer Program / Developer ID required.
          # Sparkle validates update integrity via its own EdDSA signature.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "-"
